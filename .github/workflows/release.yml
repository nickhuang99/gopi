name: release

# WHAT THIS BUILDS, AND WHY IT IS ONLY TWO TARGETS
#
# linux/amd64 and linux/arm64 are the targets that were MEASURED to cross-compile
# on this tree (2026-11-23, Go 1.24.0, CGO_ENABLED=0, `go build ./cmd/agent/`):
#
#   OK   linux/amd64  63 MB
#   OK   linux/arm64  61 MB
#   OK   darwin/arm64  72 MB Mach-O (build-tag split landed, commit dbf3eca)
#   FAIL windows/amd64  syscall.Access / syscall.Kill / syscall.Stat_t /
#                       syscall.O_NOFOLLOW / rlimit / statfs have no counterpart
#
# THE MATRIX IS STILL LINUX-ONLY, and that is deliberate: darwin COMPILES but has
# never been EXECUTED (no Mac was available). Shipping a binary nobody has ever
# run is a different and worse claim than shipping one that was measured to run,
# so darwin stays out until someone runs it on a Mac — at which point it joins
# this matrix and README's Boundaries section in the SAME change, because those
# two must not disagree.
#
# Windows still fails to build, and the gap is not syntax: rlimit, O_NOFOLLOW and
# a batch of statfs call sites have no Windows counterpart, so each needs a real
# mechanism rather than a field rename.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to stamp (e.g. v0.5.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      # The revision the binary reports is set by the LINKER, not derived at run
      # time — internal/version/self.go carries the command in full. Without this
      # ldflag `--version` prints "revision: unavailable", because the Go
      # toolchain only writes its own vcs.revision stamp when the build directory
      # is a repository root recognized by a .git DIRECTORY.
      - name: Resolve version and revision
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          VER='${{ steps.v.outputs.version }}'
          REV='${{ steps.v.outputs.revision }}'
          OUT="gopi_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}"
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/nickhuang99/gopi/internal/version.Version=${VER} \
              -X github.com/nickhuang99/gopi/internal/version.Revision=${REV}" \
            -o "dist/${OUT}" ./cmd/agent/
          ( cd dist && sha256sum "${OUT}" > "${OUT}.sha256" )
          ls -lh dist/

      # A binary that does not run is not a release artifact. The runner is
      # linux/amd64, so only that target can be executed here; the arm64 build is
      # proved to COMPILE and to carry the version stamp (read out of the binary
      # with strings, which needs no emulator), and NOT proved to execute.
      - name: Prove the artifact runs (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -eu
          BIN=$(ls dist/gopi_*_linux_amd64)
          chmod +x "$BIN"
          "$BIN" --version

      - name: Prove the version stamp is in the arm64 binary
        if: matrix.goarch == 'arm64'
        run: |
          set -eu
          BIN=$(ls dist/gopi_*_linux_arm64)
          REV='${{ steps.v.outputs.revision }}'
          if strings "$BIN" | grep -qF "$REV"; then
            echo "the arm64 artifact carries revision $REV"
          else
            echo "the arm64 artifact does NOT carry revision $REV — the ldflag did not land" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gopi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist/

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          # WHICH RELEASE, and it must be stated rather than inferred. On a tag
          # push `github.ref_name` IS the tag. On workflow_dispatch it is the
          # BRANCH (master), and the action would then look for a release named
          # "master" — which is exactly how the first run of this workflow failed
          # (both build jobs green, publish job red). The manual trigger therefore
          # names the tag in its `version` input, and that is the operand here.
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          name: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          # A manual dispatch re-uploads into an existing release rather than
          # overwriting its body with generated notes.
          generate_release_notes: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
